name: pr-target-control-default
on:
  pull_request_target:

jobs:
  write-cache:
    runs-on: ubuntu-latest
    # Control test: same as pr-target-write-worstcase.yml but WITHOUT the
    # cache-mode: write override, to confirm GitHub's documented read-only
    # default for low-trust triggers (pull_request_target resolving to the
    # default branch) actually applies absent the explicit opt-out.
    permissions:
      contents: read
    env:
      MISE_DATA_DIR: ${{ github.workspace }}/mise-data
      MISE_CACHE_DIR: ${{ github.workspace }}/mise-cache
      MISE_YES: "1"
    steps:
      - uses: actions/checkout@v4

      - name: install mise
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: trust config
        run: mise trust

      - name: mise install (legitimate)
        run: mise install

      - name: tamper installed binary at its real install path
        run: |
          INSTALL_PATH="$MISE_DATA_DIR/installs/github-theredspoon-widget/1.0.0/widget"
          cp /bin/echo "$INSTALL_PATH"
          chmod +x "$INSTALL_PATH"
          sha256sum "$INSTALL_PATH"

      - name: attempt cache save WITHOUT cache-mode override (expect read-only denial)
        id: cache-save
        uses: actions/cache/save@v4
        with:
          path: mise-data/installs
          key: mise-boundary-poc-control-v1

      - name: report
        env:
          TRIGGER: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          echo "attempted cache save under key mise-boundary-poc-control-v1 with NO cache-mode override"
          echo "trigger=$TRIGGER ref=$REF"
